name: Keep Supabase Awake

on:
  schedule:
    # Run at 00:00 UTC every 2 days to prevent Supabase free-tier 7-day inactivity pause
    - cron: "0 0 */2 * *"
  workflow_dispatch: # Enables manual triggering from the GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "WARNING: VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY secrets are not set in this repository."
            echo "Please add them in GitHub Repository -> Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          echo "Pinging Supabase REST API to prevent inactivity pause..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/site_settings?select=setting_key&limit=1")

          if [ "$response" -eq 200 ]; then
            echo "Successfully pinged Supabase (HTTP $response). Database timer reset!"
          else
            echo "Ping responded with HTTP status: $response"
          fi
